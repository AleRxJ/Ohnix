<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-v2-16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2-32.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2-48.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
        <link rel="manifest" href="/site-v2.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Tells the browser this page already has its own dark AND light
             styling, so it shouldn't apply forced/auto dark-mode darkening
             on top of what's already there (Android WebView's "force dark",
             some browsers' own dark-mode heuristics). This is a real,
             standards-based signal - but it's the browser's OWN mechanism;
             third-party dark-mode *extensions* inject their own CSS/filters
             independently and are not required to honor it, so this can
             reduce but can't guarantee-fix every such extension's
             interference. -->
        <meta name="color-scheme" content="dark light" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Non-blocking: a slow/unreachable third-party font host must never hold up
             first paint of the actual app CSS below. font-display=swap already lets text
             render in a fallback font immediately; this preload+swap trick additionally
             keeps the *stylesheet fetch itself* off the render-blocking critical path. -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
            />
        </noscript>
        <title>Software de inventario, contabilidad y facturación DIAN para pymes | Ohnix</title>
        <meta
            name="description"
            content="Ohnix centraliza inventario, compras, pedidos, contabilidad y facturación electrónica DIAN para pymes con trazabilidad en tiempo real."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Software de inventario, contabilidad y facturación DIAN para pymes | Ohnix" />
        <meta
            property="og:description"
            content="Gestiona inventario, compras, pedidos, contabilidad y facturación electrónica DIAN en una sola plataforma para pymes."
        />
        <meta property="og:url" content="https://ohnix.co/" />
        <meta property="og:image" content="https://ohnix.co/ohnix-social-preview-v2.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://ohnix.co/ohnix-social-preview-v2.png" />
        <link rel="canonical" href="https://ohnix.co/" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
