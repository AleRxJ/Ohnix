[package]
name = "ohnix-desktop"
version = "0.1.0"
description = "Ohnix Desktop - Tauri shell around the existing Ohnix web app (see docs/architecture/ohnix-multiplatform-strategy.md, Fase B)"
authors = ["Ohnix"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ohnix-desktop"
path = "src/main.rs"
